name: mesai_hesaplama
description: Mesai Hesaplama Uygulaması
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI Paketleri
  cupertino_icons: ^1.0.6
  google_fonts: ^6.3.3
  smooth_page_indicator: ^1.1.0
  fl_chart: ^0.68.0
  lucide_icons: ^0.257.0

  # Local Storage
  shared_preferences: ^2.2.2

  # Drift + SQLite
  drift: ^2.15.0
  drift_sqflite: ^2.0.1
  sqlite3_flutter_libs: ^0.5.21
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2

  # STATE MANAGEMENT (GEREKLİ)
  provider: ^6.1.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  drift_dev: ^2.15.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

